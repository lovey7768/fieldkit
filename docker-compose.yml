services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fieldkit
      - REDIS_URL=redis://redis:6379/0
      - WEBHOOK_SECRET=fieldkit_production_hmac_secret_2026
      - ERP_API_URL=http://mock-erp:8080/api/v1/sync
      - ERP_API_TOKEN=mock_erp_token_secret
      - PII_ENCRYPTION_KEY=k8v1A9zL3qP5rT7wY2xM4bN6cF8jH0sD
      - AI_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fieldkit
      - REDIS_URL=redis://redis:6379/0
      - ERP_API_URL=http://mock-erp:8080/api/v1/sync
      - ERP_API_TOKEN=mock_erp_token_secret
      - PII_ENCRYPTION_KEY=k8v1A9zL3qP5rT7wY2xM4bN6cF8jH0sD
      - AI_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fieldkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fieldkit"]
      interval: 4s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 3s
      retries: 5

  mock-erp:
    build:
      context: .
      dockerfile: mock_erp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SIMULATE_DOWN=false

volumes:
  postgres_data: