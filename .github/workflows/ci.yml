name: FieldKit CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Resilience & Integration Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Coverage Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fieldkit
          REDIS_URL: redis://localhost:6379/0
          WEBHOOK_SECRET: fieldkit_production_hmac_secret_2026
          PII_ENCRYPTION_KEY: k8v1A9zL3qP5rT7wY2xM4bN6cF8jH0sD
          ERP_API_URL: http://localhost:8080/api/v1/sync
          ERP_API_TOKEN: mock_erp_token_secret
          AI_PROVIDER: mock
        run: |
          pytest tests/ -v --durations=10